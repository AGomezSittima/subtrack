server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolving `api` per request (a variable in proxy_pass) lets nginx
    # start before the backend is up and follow whichever profile owns the alias.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        # With a variable and no URI part, the request URI (/api/v1/...) is passed unchanged.
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html, which is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
