[project]
name = "subtrack"
version = "0.1.0"
description = "Subtrack backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dateutil==4.0.0",
    "sqlalchemy==2.1.9",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-python-dateutil==2.9.0.20261116",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "S", "ANN", "RET",
  "PL", "PTH", "TID", "DTZ", "T20", "LOG", "G",
  "TD", "FIX001", "FIX003", "FIX004",
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Read the current time from the injected Clock."
"datetime.datetime.utcnow".msg = "Read the current time from the injected Clock."
"datetime.datetime.today".msg = "Read the current time from the injected Clock."
"datetime.date.today".msg = "Read the current date from the injected Clock."
"time.time".msg = "Read the current time from the injected Clock."
"time.time_ns".msg = "Read the current time from the injected Clock."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/subtrack/clock/system.py" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
