base-url = "http://api:8000/api/v1"

[generation]
# The session cookie is required only while a passcode is set, and the test stack sets none.
with-security-parameters = false

[checks]
ignored_auth.enabled = false

[[operations]]
exclude-operation-id = [
  "getHealth",
  "setClock",
  "resetData",
  "listCatalogServices",
  "createCatalogService",
  "updateCatalogService",
  "deleteCatalogService",
  "getSettings",
  "updateSettings",
]
enabled = false

# Repeated plans and hiding a user entry are 422 by rules the schema can't express.
[[operations]]
include-operation-id = ["createCatalogService", "updateCatalogService"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "404", "422"]

# A zone name can match the pattern and still be unknown to the zone database (422 invalid).
[[operations]]
include-operation-id = ["updateSettings"]
checks.positive_data_acceptance.expected-statuses = ["2xx", "422"]
