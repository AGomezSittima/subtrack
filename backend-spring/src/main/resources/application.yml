server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: subtrack
  main:
    banner-mode: off
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to the Flyway migrations; Hibernate only checks it.
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      enabled: false
  web:
    resources:
      add-mappings: false

subtrack:
  version: "@version@"
  test-mode: ${SUBTRACK_TEST_MODE:false}
  db-path: ${DB_PATH:subs.db}
  template-db-path: ${SUBTRACK_TEMPLATE_DB:}
