# Every push and pull request: static checks and unit tests for the parts whose paths changed
# (all of them on main), then the shared API suite against both backends.
# A pull request from a branch of this repository is already covered by the push run of the same
# commit, so its pull_request run is skipped; pull requests from forks get a full run.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only.
  LEFTHOOK: "0"

jobs:
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # On pull requests paths-filter lists the changed files through the REST API.
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      fastapi: ${{ steps.filter.outputs.fastapi }}
      spring: ${{ steps.filter.outputs.spring }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a branch push, compare with main (the whole branch), not only with the previous
          # push; otherwise a job that failed earlier is skipped once later pushes avoid its files.
          # On main itself paths-filter compares with the commit before the push.
          base: ${{ github.event.repository.default_branch }}
          filters: |
            # Changes to how a part is checked also re-run that part.
            shared: &shared
              - ".github/workflows/ci.yml"
              - "justfile"
            js:
              - *shared
              - ".nvmrc"
              - "frontend/**"
              - "e2e/**"
              - "contract/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".prettierignore"
              - "**/*.{md,yml,yaml,json}"
            fastapi:
              - *shared
              - "backend-fastapi/**"
            spring:
              - *shared
              - "backend-spring/**"

  js:
    name: frontend, e2e, contract
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type checks
        run: just lint-js
      - name: Unit tests
        run: just test-unit-js
      - name: Generated files are up to date
        run: just check-generated

  fastapi:
    needs: changes
    if: needs.changes.outputs.fastapi == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (`@v10` does not resolve); pin the release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.13
          working-directory: backend-fastapi
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - name: Lint and type checks
        run: just lint-fastapi
      - name: Unit tests
        run: just test-unit-fastapi

  spring:
    needs: changes
    if: needs.changes.outputs.spring == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default (enhanced) provider is proprietary; basic is the MIT one on actions/cache.
          cache-provider: basic
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - name: Format check and compile (warnings are errors)
        run: just lint-spring
      - name: Unit tests
        run: just test-unit-spring

  api-suite:
    name: API suite (${{ matrix.profile }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [fastapi, spring]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - run: pnpm install --frozen-lockfile --filter "@subtrack/e2e..."
      - name: Run the API suite against a fresh test-mode stack
        run: just test-api ${{ matrix.profile }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-report-${{ matrix.profile }}
          path: e2e/playwright-report/
          retention-days: 7
